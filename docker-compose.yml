services:
  db:
    image: postgres:15-alpine
    container_name: mta_subway_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
   build: .
   container_name: mta_subway_api
   ports:
    - "8000:8000"
   volumes:
    - .:/app
   environment:
    DATABASE_URL: ${DATABASE_URL}
volumes:
  postgres_data: